name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # A real Redis, so the production shared-state adapter and the multi-instance
    # tests run against Redis, not only the in-memory development store.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium ffmpeg
      - run: pnpm e2e
      # Kept even when a retry passes, so flaky first attempts can be investigated.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  smoke:
    name: Production build smoke test (Function bundle + Redis)
    runs-on: ubuntu-latest
    needs: check
    # The deployable build — static client + api/socket.mjs on one origin, as on
    # Vercel — with shared state in a real Redis; two browsers play Dots & Boxes.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Start the production-style server
        run: node tools/serve-production.mjs 4300 > server.log 2>&1 &
        env:
          REDIS_URL: redis://localhost:6379
          ALLOWED_ORIGINS: http://localhost:4300
          LOG_LEVEL: info
          # CI-only token for the load test's server statistics (operator endpoint).
          METRICS_TOKEN: ci-load-test-token-0001
      - name: Wait until it answers
        run: for i in $(seq 60); do curl -sf http://localhost:4300/api/socket/healthz && exit 0; sleep 1; done; exit 1
      - run: pnpm smoke
      # Lightweight load test (Phase 10): 20 then 40 players on the production build
      # with Redis; the report (latency, errors, CPU, memory, Redis commands) goes to
      # the job summary. Not a capacity benchmark.
      - name: Lightweight load test
        run: pnpm vitest run apps/server/test/load
        env:
          LOAD: '1'
          LOAD_URL: http://localhost:4300
          LOAD_TOKEN: ci-load-test-token-0001
          LOAD_SECONDS: '45'
          REDIS_URL: redis://localhost:6379
          LOAD_OUT: load-report.json
      - name: Load test report
        if: ${{ always() }}
        run: cat load-report.json || echo "no load report"
      - if: ${{ always() }}
        run: cat server.log
