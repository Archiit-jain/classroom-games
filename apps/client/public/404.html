<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5b3df5" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Page not found · Classroom Games</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: 'Baloo 2', ui-rounded, system-ui, sans-serif;
        color: #fbf8ff;
        text-align: center;
        background:
          radial-gradient(circle at 10% 6%, rgba(255, 62, 138, 0.32), transparent 36%),
          radial-gradient(circle at 92% 2%, rgba(45, 226, 230, 0.24), transparent 34%),
          radial-gradient(circle at 60% 104%, rgba(255, 210, 63, 0.18), transparent 44%), #130b2e;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-width: 420px;
      }
      .top {
        font-weight: 800;
        letter-spacing: 0.38em;
        margin-right: -0.38em;
        color: #2de2e6;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.6rem, 12vw, 4rem);
        line-height: 1;
        color: #ffd23f;
        text-shadow:
          3px 4px 0 #ff3e8a,
          6px 7px 0 #07041a;
      }
      p {
        margin: 0;
        color: #b9afe8;
        font-family: system-ui, sans-serif;
        line-height: 1.45;
      }
      a {
        margin-top: 8px;
        padding: 12px 26px;
        border: 3px solid #07041a;
        border-radius: 999px;
        background: #ffd23f;
        color: #1f1647;
        font-weight: 800;
        font-size: 1.15rem;
        text-decoration: none;
        box-shadow: 0 5px 0 #07041a;
      }
      a:focus-visible {
        outline: 3px solid #2de2e6;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="top">Classroom</span>
      <h1>Oops!</h1>
      <p>This page doesn’t exist. The games are just one tap away.</p>
      <a href="/">Go to the games</a>
    </main>
  </body>
</html>
